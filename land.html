---
title: Land
---

<section class="gallery">
  {% assign land_images = site.static_files | where_exp: "file", "file.path contains '/uploads/land/'" %}
  
  {% for image in land_images %}
    <div class="gallery-item">
      <img src="{{ image.path }}" alt="Land work">
    </div>
  {% endfor %}
</section>

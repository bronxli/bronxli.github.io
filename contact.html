---
title: Contact
---
<p class="editable">Available for selected projects.</p>
<p class="editable">合作与影像项目可约。</p>

<form method="post" action="{{ site.baseurl }}/contact-success/">
  <input type="hidden" name="_to" value="{{ site.data.email }}" />
  <input type="text" name="_gotcha" style="display: none;">

  <label for="name">Name</label>
  <input type="text" name="name" id="name" required />

  <label for="email">Email</label>
  <input type="email" name="email" id="email" required />

  <label for="purpose">Project type</label>
  <select id="purpose" name="purpose">
    <option value="brand">Brand collaboration</option>
    <option value="commercial">Commercial shoot</option>
    <option value="video">Video production</option>
    <option value="other">Other</option>
  </select>

  <input type="submit" value="Send" />
</form>

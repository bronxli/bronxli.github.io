---
title: Contact
---
<p class="editable">Available for selected projects.</p>
<p class="editable">合作与影像项目可约。</p>

<form method="post" action="{{ site.baseurl }}/contact-success/">
  <input type="hidden" name="_to" value="{{ site.data.email }}" />
  <input type="text" name="_gotcha" style="display: none;">

  <label for="name">姓名</label>
  <input type="text" name="name" id="name" required />

  <label for="email">邮箱</label>
  <input type="email" name="email" id="email" required />

  <label for="purpose">合作意向</label>
  <select id="purpose" name="purpose">
      <option value="brand">品牌合作</option>
      <option value="commercial">商业拍摄</option>
      <option value="video">影像制作</option>
      <option value="other">其他</option>
  </select>

  <textarea name="message" id="message"></textarea>

  <input type="submit" value="发送" />
</form>
